<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Pamasoft CloudStay dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="48" y="40" width="1104" height="640" rx="24" fill="url(#card)"/>
  <!-- sidebar -->
  <rect x="48" y="40" width="220" height="640" rx="24" fill="#0f172a"/>
  <rect x="72" y="72" width="120" height="18" rx="9" fill="#38bdf8"/>
  <rect x="72" y="120" width="160" height="12" rx="6" fill="#64748b"/>
  <rect x="72" y="150" width="140" height="12" rx="6" fill="#334155"/>
  <rect x="72" y="180" width="150" height="12" rx="6" fill="#334155"/>
  <rect x="72" y="210" width="130" height="12" rx="6" fill="#334155"/>
  <rect x="72" y="260" width="160" height="36" rx="10" fill="#1B4FD8"/>
  <rect x="72" y="310" width="150" height="12" rx="6" fill="#475569"/>
  <rect x="72" y="340" width="140" height="12" rx="6" fill="#475569"/>
  <rect x="72" y="370" width="155" height="12" rx="6" fill="#475569"/>
  <!-- header -->
  <text x="300" y="90" fill="#0f172a" font-family="Arial,sans-serif" font-size="28" font-weight="700">CloudStay</text>
  <text x="300" y="120" fill="#64748b" font-family="Arial,sans-serif" font-size="16">Area hotel · Panoramica operativa</text>
  <!-- KPI cards -->
  <rect x="300" y="150" width="200" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="185" fill="#1B4FD8" font-family="Arial,sans-serif" font-size="14" font-weight="700">Prenotazioni</text>
  <text x="320" y="225" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">128</text>
  <rect x="520" y="150" width="200" height="100" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="540" y="185" fill="#0d9488" font-family="Arial,sans-serif" font-size="14" font-weight="700">Occupancy</text>
  <text x="540" y="225" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">86%</text>
  <rect x="740" y="150" width="200" height="100" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="760" y="185" fill="#c2410c" font-family="Arial,sans-serif" font-size="14" font-weight="700">ADR medio</text>
  <text x="760" y="225" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">142</text>
  <rect x="960" y="150" width="160" height="100" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="980" y="185" fill="#b91c1c" font-family="Arial,sans-serif" font-size="14" font-weight="700">Arrivi oggi</text>
  <text x="980" y="225" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">14</text>
  <!-- calendar strip -->
  <rect x="300" y="280" width="820" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="315" fill="#0f172a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Calendario camere</text>
  <rect x="320" y="340" width="110" height="28" rx="8" fill="#1B4FD8"/>
  <rect x="440" y="340" width="90" height="28" rx="8" fill="#93c5fd"/>
  <rect x="540" y="340" width="130" height="28" rx="8" fill="#0d9488"/>
  <rect x="680" y="340" width="70" height="28" rx="8" fill="#cbd5e1"/>
  <rect x="320" y="380" width="80" height="28" rx="8" fill="#cbd5e1"/>
  <rect x="410" y="380" width="150" height="28" rx="8" fill="#1B4FD8"/>
  <rect x="570" y="380" width="100" height="28" rx="8" fill="#f59e0b"/>
  <rect x="680" y="380" width="120" height="28" rx="8" fill="#0d9488"/>
  <rect x="320" y="420" width="160" height="28" rx="8" fill="#0d9488"/>
  <rect x="490" y="420" width="90" height="28" rx="8" fill="#93c5fd"/>
  <rect x="590" y="420" width="140" height="28" rx="8" fill="#1B4FD8"/>
  <!-- bottom modules -->
  <rect x="300" y="490" width="260" height="150" rx="16" fill="#0f172a"/>
  <text x="320" y="530" fill="#38bdf8" font-family="Arial,sans-serif" font-size="16" font-weight="700">PriceIQ</text>
  <text x="320" y="560" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14">+12% weekend sugerito</text>
  <text x="320" y="590" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Applica · Conservativo</text>
  <rect x="580" y="490" width="260" height="150" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="600" y="530" fill="#0d9488" font-family="Arial,sans-serif" font-size="16" font-weight="700">Housekeeping</text>
  <text x="600" y="560" fill="#134e4a" font-family="Arial,sans-serif" font-size="14">18 camere pronte</text>
  <text x="600" y="590" fill="#64748b" font-family="Arial,sans-serif" font-size="13">3 task in corso</text>
  <rect x="860" y="490" width="260" height="150" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="880" y="530" fill="#1B4FD8" font-family="Arial,sans-serif" font-size="16" font-weight="700">Guest portal</text>
  <text x="880" y="560" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="14">Pre-check-in attivo</text>
  <text x="880" y="590" fill="#64748b" font-family="Arial,sans-serif" font-size="13">NPS 72 · feedback</text>
</svg>
