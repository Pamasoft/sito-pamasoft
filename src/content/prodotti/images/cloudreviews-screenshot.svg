<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="CloudReviews">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F7F1"/>
      <stop offset="100%" stop-color="#F4FBF8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <rect x="80" y="90" width="800" height="540" rx="28" fill="#fff" stroke="#D1E7DD" stroke-width="2"/>
  <text x="120" y="160" font-family="Georgia, serif" font-size="36" fill="#046644">Nuova richiesta inviata</text>
  <text x="120" y="210" font-family="Arial, sans-serif" font-size="20" fill="#4B6358">Cliente soddisfatto ’ CTA Google in un tap</text>
  <g transform="translate(120 260)">
    <rect width="64" height="64" rx="12" fill="#00875A"/>
    <text x="20" y="42" font-family="Arial" font-size="28" fill="#fff"></text>
    <text x="84" y="28" font-family="Arial" font-size="22" fill="#0F172A">45 stelle</text>
    <text x="84" y="54" font-family="Arial" font-size="16" fill="#64748B">Link Google sempre visibile</text>
  </g>
  <g transform="translate(120 360)">
    <rect width="64" height="64" rx="12" fill="#B45309"/>
    <text x="20" y="42" font-family="Arial" font-size="28" fill="#fff">!</text>
    <text x="84" y="28" font-family="Arial" font-size="22" fill="#0F172A">13 stelle</text>
    <text x="84" y="54" font-family="Arial" font-size="16" fill="#64748B">Alert al titolare, prima che diventi una critica pubblica</text>
  </g>
  <g transform="translate(120 460)">
    <rect width="64" height="64" rx="12" fill="#0F766E"/>
    <text x="18" y="42" font-family="Arial" font-size="28" fill="#fff">»</text>
    <text x="84" y="28" font-family="Arial" font-size="22" fill="#0F172A">Riattivazione</text>
    <text x="84" y="54" font-family="Arial" font-size="16" fill="#64748B">I clienti felici tornano a lasciare (o rinnovare) fiducia</text>
  </g>
  <rect x="620" y="280" width="200" height="220" rx="20" fill="#00875A"/>
  <text x="650" y="360" font-family="Georgia, serif" font-size="28" fill="#fff">+ Recensioni</text>
  <text x="650" y="400" font-family="Arial" font-size="16" fill="#D1FAE5">Zero review gating</text>
  <text x="650" y="430" font-family="Arial" font-size="16" fill="#D1FAE5">Orari rispettati</text>
  <text x="650" y="460" font-family="Arial" font-size="16" fill="#D1FAE5">API &amp; import CSV</text>
</svg>
