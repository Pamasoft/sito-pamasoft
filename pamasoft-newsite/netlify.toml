[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirect rules for clean URLs
[[redirects]]
  from = "/servizi/cloud-computing"
  to = "/servizi/cloud-computing/"
  status = 301
  
[[redirects]]
  from = "/servizi/intelligenza-artificiale"
  to = "/servizi/intelligenza-artificiale/"
  status = 301

[[redirects]]
  from = "/chi-siamo"
  to = "/chi-siamo/"
  status = 301

[[redirects]]
  from = "/contatti"
  to = "/contatti/"
  status = 301

# Form handling
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Contact form handling
[[forms]]
  name = "contact"
