<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pamasoft</title>
    <style>
        /* Impostazioni globali */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #ffffff;
        }
        /* Contenitore centrato */
        .container {
            text-align: center;
        }
        /* Stile per il logo */
        .logo img {
            width: 250px; /* Dimensiona il logo */
            height: auto;
        }
        /* Stile per il testo */
        .message {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo centrato -->
        <div class="logo">
            <img src="logo-blu-cropped.png" alt="Logo">
        </div>

        <!-- Messaggio sotto il logo -->
        <div class="message">
            New website coming soon
        </div>
    </div>

</body>
</html>
