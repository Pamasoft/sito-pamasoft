[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/servizi/cloud-computing"
  to = "/servizi/cloud-computing/"
  status = 301

[[redirects]]
  from = "/servizi/intelligenza-artificiale"
  to = "/servizi/intelligenza-artificiale/"
  status = 301

[[redirects]]
  from = "/chi-siamo"
  to = "/chi-siamo/"
  status = 301

[[redirects]]
  from = "/contatti"
  to = "/contatti/"
  status = 301

[[redirects]]
  from = "/prodotti/cloudretail"
  to = "/prodotti/cloudpos/"
  status = 301

[[redirects]]
  from = "/prodotti/cloudretail/"
  to = "/prodotti/cloudpos/"
  status = 301

[[redirects]]
  from = "/en/prodotti/cloudretail"
  to = "/en/prodotti/cloudpos/"
  status = 301

[[redirects]]
  from = "/en/prodotti/cloudretail/"
  to = "/en/prodotti/cloudpos/"
  status = 301

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
